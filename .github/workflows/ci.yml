name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, because it is the cheapest gate and one of its rules is load
      # bearing: the browser/server import boundary. `check-client-bundle` in
      # the build step catches the same mistake, but only after a full build,
      # and only for what actually reached an emitted asset. Linting says so in
      # seconds, and names the import.
      #
      # `--max-warnings 0` is in the script, so a warning fails here too. That
      # is the point — a warning nobody has to fix is one nobody fixes.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The suite shells out to real git rather than mocking it, so it needs a
      # git identity to make commits with.
      - name: Configure git for the test suite
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git --version

      # Build first: the HTTP suite runs the built server, so it has to exist.
      # `pnpm build` also runs scripts/check-client-bundle.mjs, which fails if a
      # server module reached the browser bundle.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Only chromium: these check that pages render and forms work, which is
      # not a cross-browser question, and the download dominates the job time.
      - name: Install the browser for the end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Keep the trace from a failed browser test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisory, not blocking: a new advisory in a transitive dependency
      # shouldn't wedge unrelated pull requests, but it should be visible.
      - name: Audit production dependencies
        run: pnpm audit --prod || true

  # The image is what actually runs on Railway, and nothing above builds it:
  # the HTTP suite boots the compiled server with node directly. So the
  # ENTRYPOINT, the apt packages, the ob pin and the volume layout were only
  # ever exercised by a deploy. This builds it and checks the two things that
  # matter and are cheap to check: that it boots, and that tini is PID 1 with
  # node as its child and reaps orphans — the reason tini is there at all.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t notemesh:ci .

      # A named volume, root-owned and already holding a vault written by root:
      # what a deployment upgraded from an image that ran as root looks like.
      # The entrypoint has to make it the node user's before the server can
      # boot, and the file has to survive readable. ENCRYPTION_KEY is the only
      # required variable.
      - name: Prepare a root-owned volume, as an older image would have left it
        run: |
          docker volume create nmdata >/dev/null
          docker run --rm -v nmdata:/data notemesh:ci sh -c 'mkdir -p /data/vault && echo "# From before" > /data/vault/Before.md && chown -R 0:0 /data && ls -ln /data'

      - name: Start a container
        run: |
          docker run -d --name nm \
            -e ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -v nmdata:/data \
            notemesh:ci

      - name: It boots and answers /api/health
        run: |
          for i in $(seq 1 30); do
            if docker exec nm node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "never became healthy"; exit 1

      # /proc rather than ps: the slim image has no procps, and /proc is the
      # source ps reads anyway.
      - name: tini is PID 1 and node is its child
        run: |
          pid1=$(docker exec nm cat /proc/1/comm)
          echo "PID 1: $pid1"
          test "$pid1" = "tini"
          children=$(docker exec nm sh -c 'for s in /proc/[0-9]*/status; do grep -q "^PPid:[[:space:]]*1$" "$s" && sed -n "s/^Name:[[:space:]]*//p" "$s"; done')
          echo "children of PID 1: $children"
          echo "$children" | grep -qx node

      # The server process is node's, not root's; the volume became node's and
      # its earlier file is still readable; /app is not writable by node.
      - name: node runs unprivileged, owns its data, and cannot write /app
        run: |
          uid=$(docker exec nm sh -c 'for s in /proc/[0-9]*/status; do grep -q "^Name:[[:space:]]*node$" "$s" && sed -n "s/^Uid:[[:space:]]*\([0-9]*\).*/\1/p" "$s" && break; done')
          echo "node uid: $uid"
          test "$uid" = "$(docker exec nm id -u node)"
          docker exec nm sh -c 'setpriv --reuid=node --regid=node --init-groups sh -c "cat /data/vault/Before.md && touch /data/vault/After.md && test ! -w /app/.output"'

      # Spawn a shell that backgrounds a sleep and exits, orphaning the sleep
      # onto PID 1. Once the sleep ends, an init reaps it; a bare node would
      # leave it as a zombie. This is the failure the ENTRYPOINT exists to stop.
      - name: PID 1 reaps orphans
        run: |
          docker exec nm sh -c 'sh -c "sleep 1 & exit 0"; sleep 3'
          zombies=$(docker exec nm sh -c 'grep -l "^State:[[:space:]]*Z" /proc/[0-9]*/status 2>/dev/null | wc -l')
          echo "zombies: $zombies"
          test "$zombies" -eq 0

      - name: Container logs
        if: failure()
        run: docker logs nm

      - name: Stop the container
        if: always()
        run: docker rm -f nm >/dev/null 2>&1 || true; docker volume rm nmdata >/dev/null 2>&1 || true
