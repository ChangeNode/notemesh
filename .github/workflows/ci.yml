name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, because it is the cheapest gate and one of its rules is load
      # bearing: the browser/server import boundary. `check-client-bundle` in
      # the build step catches the same mistake, but only after a full build,
      # and only for what actually reached an emitted asset. Linting says so in
      # seconds, and names the import.
      #
      # `--max-warnings 0` is in the script, so a warning fails here too. That
      # is the point — a warning nobody has to fix is one nobody fixes.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The suite shells out to real git rather than mocking it, so it needs a
      # git identity to make commits with.
      - name: Configure git for the test suite
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git --version

      # Build first: the HTTP suite runs the built server, so it has to exist.
      # `pnpm build` also runs scripts/check-client-bundle.mjs, which fails if a
      # server module reached the browser bundle.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Only chromium: these check that pages render and forms work, which is
      # not a cross-browser question, and the download dominates the job time.
      - name: Install the browser for the end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Keep the trace from a failed browser test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisory, not blocking: a new advisory in a transitive dependency
      # shouldn't wedge unrelated pull requests, but it should be visible.
      - name: Audit production dependencies
        run: pnpm audit --prod || true
