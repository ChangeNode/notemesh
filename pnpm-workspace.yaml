allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  - better-sqlite3@13.0.2
  - hono@4.12.34

# Security patches for transitive dependencies. Each is the lowest version that
# clears an advisory reported by `pnpm audit`, pinned within the major line the
# framework targets rather than jumping to an RC.
overrides:
  h3: ^1.15.11 # path traversal, SSE injection, request smuggling
  hono: ^4.13.11 # ReDoS in CORS middleware; 4.13.11 also clears parseBody, query, serveStatic and JSX advisories
  "@hono/node-server": ^2.1.3 # serveStatic double-decodes the request path
  fast-uri: ^3.1.9 # host confusion, scheme spoofing and path equivalence in URI parsing (#62)
  qs: ^6.16.1 # prototype pollution and DoS in query parsing, reached only through the MCP SDK's Express (#62)
  brace-expansion: ^2.1.7 # DoS via recursion and quadratic expansion
  seroval: ^1.6.10 # deserialization of attacker-chosen callables, DoS, script injection
  proxy-addr: ^2.0.8 # IP spoofing via IPv4-mapped IPv6 trust check
  body-parser: ^2.4.0 # DoS via trailing bytes
  ip-address: ^10.7.4 # subnet and link-local misclassification, quadratic zone parsing
  vite: ^6.4.4 # fs.allow bypass and launch-editor advisories in the dev server
  follow-redirects: ^1.16.1 # cross-origin credential leak on redirect
  node-forge: ^1.4.1 # RSA PKCS#1 v1.5 signature forgery
  source-map-js: ^1.2.2 # event-loop DoS on crafted source maps
  serialize-javascript: ^7.1.3 # XSS via unescaped input
  js-yaml@4: ^4.3.2 # CPU DoS via merge keys (ESLint config loader)
  nanoid: ^3.3.17 # custom generators loop forever when size is zero

# CI fails on a high or critical advisory in a production dependency. An
# advisory that has been reviewed and found not to apply goes here, with
# the reason, and comes out when the fix lands.
auditConfig:
  ignoreCves: []
